# ==========================================================
# Legacy PHP Guard
# Schutzschicht fuer PHP 5.3.29 / mod_php / Joomla
# hinter Apache 2.4 + ModSecurity 2.9.15
#
# Laden NACH modsecurity.conf (modsecurity.conf-recommended):
#   Include conf/modsecurity.conf
#   Include conf/legacy-php-guard.conf
#
# Rollout: zuerst SecRuleEngine DetectionOnly (Default der
# recommended-Konfiguration), Logs pruefen, erst dann On.
# Regel-IDs 1100001-1100009 (frei, kollidiert nicht mit
# 200000-200007 aus modsecurity.conf-recommended).
# ==========================================================

SecRequestBodyAccess On

# Maximaler Request-Body: 32 MiB (Joomla-Uploads beruecksichtigt)
SecRequestBodyLimit 33554432
SecRequestBodyLimitAction Reject

# Nicht-Datei-POST-Daten maximal 1 MiB
SecRequestBodyNoFilesLimit 1048576

# Argumentzahl begrenzen (Parser verarbeitet max. 300 Argumente)
SecArgumentsLimit 300

# Upload-Dateien pro Request begrenzen
SecUploadFileLimit 10


# Request-Body konnte nicht korrekt geparst werden
SecRule REQBODY_ERROR "!@eq 0" \
    "id:1100001,phase:2,deny,status:400,log,t:none,msg:'LegacyPHP Guard: request body parsing error',logdata:'%{REQBODY_ERROR_MSG}'"

# Doppelte Multipart-Part-Header (z.B. zwei Content-Disposition in einem Part)
SecRule MULTIPART_DUPLICATE_PART_HEADER "!@eq 0" \
    "id:1100002,phase:2,deny,status:400,log,t:none,msg:'LegacyPHP Guard: duplicate multipart part header'"

# Ungueltiger Multipart-Part
SecRule MULTIPART_INVALID_PART "!@eq 0" \
    "id:1100003,phase:2,deny,status:400,log,t:none,msg:'LegacyPHP Guard: invalid multipart part'"

# Ungueltiges Header-Folding in Multipart-Headern
SecRule MULTIPART_INVALID_HEADER_FOLDING "!@eq 0" \
    "id:1100004,phase:2,deny,status:400,log,t:none,msg:'LegacyPHP Guard: invalid multipart header folding'"

# Boundary-Fehler
SecRule MULTIPART_UNMATCHED_BOUNDARY "!@eq 0" \
    "id:1100005,phase:2,deny,status:400,log,t:none,msg:'LegacyPHP Guard: unmatched multipart boundary'"

# Zu viele Upload-Dateien (ueber SecUploadFileLimit)
SecRule MULTIPART_FILE_LIMIT_EXCEEDED "!@eq 0" \
    "id:1100006,phase:2,deny,status:413,log,t:none,msg:'LegacyPHP Guard: upload file count exceeded'"

# Zu viele Argumente gesamt (GET + POST)
SecRule &ARGS "@ge 300" \
    "id:1100007,phase:2,deny,status:400,log,t:none,msg:'LegacyPHP Guard: excessive argument count'"

# Zu viele POST-Felder
SecRule &ARGS_POST "@gt 150" \
    "id:1100008,phase:2,deny,status:400,log,t:none,msg:'LegacyPHP Guard: excessive POST field count'"

# Gesamtzahl der Header-Zeilen ueber alle Multipart-Parts begrenzen
SecRule &MULTIPART_PART_HEADERS "@gt 200" \
    "id:1100009,phase:2,deny,status:400,log,t:none,msg:'LegacyPHP Guard: excessive multipart header count'"
